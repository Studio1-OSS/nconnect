name: Live Agent Gauntlet

# On-demand ONLY. These are real-inference tests: they install four coding-agent
# CLIs and run live turns against Nebius, so they need the NEBIUS_API_KEY repo
# secret and consume API credits. Run them from the Actions tab (or `gh workflow
# run "Live Agent Gauntlet"`) when you want a full live verification. Every-push
# checks live in ci.yml (offline, free).
on:
  workflow_dispatch:
    inputs:
      harness:
        description: "Harness test file to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - claude
          - codex
          - live-models-check
          - opencode
          - pi
          - unreal

concurrency:
  group: live-agent-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    name: Real inference harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      NCONNECT_DEBUG: "1"
      VITEST_RETRY: "3"
      HARNESS: ${{ github.event.inputs.harness || 'all' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.9.0"

      - name: Verify Nebius secret
        run: |
          if [ -z "$NEBIUS_API_KEY" ]; then
            echo "NEBIUS_API_KEY repository secret is required for live inference tests." >&2
            exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Verify TypeScript native compiler
        run: node_modules/.bin/tsc --version

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Install coding-agent CLIs
        run: |
          case "$HARNESS" in
            all)
              # OpenCode's official npm package is `opencode-ai`; it installs the
              # `opencode` binary. See https://github.com/anomalyco/opencode.
              npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai@latest @earendil-works/pi-coding-agent
              claude --version
              codex --version
              opencode --version
              pi --version
              ;;
            live-models-check)
              npm install -g @anthropic-ai/claude-code @openai/codex
              claude --version
              codex --version
              ;;
            claude)
              npm install -g @anthropic-ai/claude-code
              claude --version
              ;;
            codex)
              npm install -g @openai/codex
              codex --version
              ;;
            opencode)
              # OpenCode's official npm package is `opencode-ai`; it installs the
              # `opencode` binary. See https://github.com/anomalyco/opencode.
              npm install -g opencode-ai@latest
              opencode --version
              ;;
            pi)
              npm install -g @earendil-works/pi-coding-agent
              pi --version
              ;;
            unreal)
              # Prebuilt runner from the Unreal Agent release; building it needs Go 1.27+.
              curl -fsSL -o /tmp/unreal.tgz https://github.com/unreallabsai/unreal-agent/releases/download/v0.1.1/unreal-agent-runner_0.1.1_linux_amd64.tar.gz
              curl -fsSL -o /tmp/unreal.sums https://github.com/unreallabsai/unreal-agent/releases/download/v0.1.1/SHA256SUMS
              echo "$(grep linux_amd64 /tmp/unreal.sums | awk '{print $1}')  /tmp/unreal.tgz" | sha256sum -c -
              tar -xzf /tmp/unreal.tgz -C /tmp unreal-agent-runner
              sudo install -m 755 /tmp/unreal-agent-runner /usr/local/bin/unreal-agent-runner
              unreal-agent-runner -h | head -1
              ;;
            *)
              echo "Unknown harness: $HARNESS" >&2
              exit 1
              ;;
          esac

      - name: Build nconnect CLI
        run: pnpm exec turbo run build --filter @nconnect/models --filter @nconnect/cli

      - name: Typecheck live tests
        run: node_modules/.bin/tsc -p packages/tests/tsconfig.json --noEmit

      - name: Run live agent gauntlet
        run: |
          case "$HARNESS" in
            all)
              VITEST_FILE_PARALLELISM=0 VITEST_MAX_CONCURRENCY=1 pnpm exec turbo run test:gauntlet:core test:gauntlet:claude test:gauntlet:codex test:gauntlet:opencode test:gauntlet:pi --filter @nconnect/tests --concurrency=1
              ;;
            claude)
              pnpm exec turbo run test:gauntlet:claude --filter @nconnect/tests
              ;;
            codex)
              pnpm exec turbo run test:gauntlet:codex --filter @nconnect/tests
              ;;
            live-models-check)
              pnpm exec turbo run test:gauntlet:live-models-check --filter @nconnect/tests
              ;;
            opencode)
              pnpm exec turbo run test:gauntlet:opencode --filter @nconnect/tests
              ;;
            pi)
              pnpm exec turbo run test:gauntlet:pi --filter @nconnect/tests
              ;;
            unreal)
              pnpm exec turbo run test:gauntlet:unreal --filter @nconnect/tests
              ;;
            *)
              echo "Unknown harness: $HARNESS" >&2
              exit 1
              ;;
          esac

      - name: Stop nconnect daemon
        if: always()
        run: node packages/cli/dist/bin/nconnect.js daemon stop || true

      - name: Save Turborepo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload live test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-agent-gauntlet-artifacts
          path: packages/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14
